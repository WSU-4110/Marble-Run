<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Marble Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/start.css">
</head>

<body>
    <nav class="top-bar" aria-label="Account and settings">
    <button class="top-btn" id="settings-btn" type="button">Settings</button>
    <button class="top-btn" id="logout-btn" type="button">Log out</button>
    </nav>

    <main class="start">
        <p class="greeting" id="greeting"></p>
        <h1>Math Marble Race</h1>
        <p class="lead">Answer fast. Roll faster.</p>

        <section class="rules" aria-labelledby="rules-title">
            <h2 id="rules-title">How to play</h2>
            <ul>
                <li>Solve each math question before the timer runs out.</li>
                <li>A correct answer boosts your marble forward.</li>
                <li>A wrong answer or an empty timer slows it down.</li>
                <li>Cross the finish line first to win coins.</li>
            </ul>
        </section>

        <button class="start-btn" id="start-btn" type="button">Start race</button>
    </main>

    <div class="modal" id="settings-modal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <header class="modal-header">
                <h2 id="settings-title">Settings</h2>
                <button class="modal-close" id="settings-close" type="button" aria-label="Close settings">×</button>
            </header>
    
            <section>
                <h3>Audio</h3>
    
                <label class="toggle">
                    <input type="checkbox" id="mute-all">
                    Mute all
                </label>
    
                <label for="music-volume">Music: <span id="music-value"></span></label>
                <input type="range" id="music-volume" min="0" max="100">
    
                <label for="sfx-volume">Sound effects: <span id="sfx-value"></span></label>
                <input type="range" id="sfx-volume" min="0" max="100">
            </section>
        </div>
    </div>

    <script type="module" src="js/start.js"></script>
</body>

</html>
