<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Marble Race - Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="timer" role="timer" aria-label="Time left">
        <div class="timer-track">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
        <span class="timer-text" id="timer-text">3</span>
    </div>

    <a class="home-btn" href="start-screen.html">Home</a>

    <main class="game">
        <p class="hud" id="hud"></p>

        <p class="question" id="question" aria-live="polite"></p>

        <form id="answer-form" novalidate>
            <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="Type your answer"
                aria-label="Your answer">
            <button class="answer-btn" type="submit">Answer</button>
        </form>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        <div class="popup" id="popup" hidden>
            <button class="restart-btn" id="restart" type="button">Restart</button>
        </div>
    </main>

    <!-- game.js runs the race, timer and canvas; it imports js/questions.js for the questions -->
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/coins.js"></script>
</body>

</html>
