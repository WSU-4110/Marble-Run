<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Marble Race - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="background" aria-hidden="true"></div>
    <main>

        <header class="intro">
            <h1>Math Marble Race</h1>
            <p class="lead">Choose a new password</p>
        </header>

        <section class="card">
            <form id="reset-form" novalidate>
                <label for="new-password">New password</label>
                <input id="new-password" type="password" minlength="6" required>

                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" type="password" minlength="6" required>

                <button class="primary" type="submit">Save password</button>
                <p class="msg" id="reset-msg" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script type="module" src="js/reset-password.js"></script>
</body>

</html>
