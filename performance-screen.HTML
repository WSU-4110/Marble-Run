<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Marble Race - Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/start.css">
</head>

<body>
    <nav class="top-bar" aria-label="Account and settings">
    <div class="coins">🪙 <span id="coin-count">0</span></div>
    <button class="top-btn" id="settings-btn" type="button">Settings</button>
    <button class="top-btn" id="logout-btn" type="button">Log out</button>
    </nav>
    <a class="shop-btn" href="shop-screen.HTML">Shop</a>

    <main class="start">
        <p class="greeting" id="greeting"></p>
        <h1>Results</h1>
        <p class="lead">-------------</p>

        <section class="rules" aria-labelledby="rules-title">
            <ul>
                <li>Placed in:</li>
                <li>Correct Answers:</li>
                <li>Wrong Answers:</li>
                <li>Coins Earned:</li>
            </ul>
        </section>

        <a class="level-btn" href="difficulty-screen.HTML">Choose Level</a>
        
        <button class="start-btn" id="start-btn" type="button">Start race</button>
    </main>


    <script type="module" src="js/results.js"></script>
</body>

</html>
